# Contest-specific tasks for this competition's solution.
#
# Taskfile.yml includes this file with flatten:true, so these tasks are called
# without a namespace and read the generic file's vars. Task names must not
# collide with the generic file: Go Task rejects duplicates instead of
# overriding them. The generic side reaches this file only through hook tasks
# it declares (currently prepare-db-assets and gen-contest-routing); a contest
# that has nothing to do defines the hook here with no commands.
version: '3'

tasks:
  prepare-db-assets:
    desc: deployへ載せる前にDB資材を生成・検証する（deploy系のhook、既定は何もしない）

  initialize-cluster:
    desc: Initialize the cluster after the application services are ready
    deps: [build-deployctl]
    preconditions:
      - sh: test ! -f '{{.RUN_STATE_FILE}}'
        msg: active benchmark exists
    cmds:
      - '{{.DEPLOYCTL_DIR}}/deployctl apply app-initialize -config {{.DEPLOYCTL_CONFIG}} {{.DEPLOYCTL_COMMON}}'

  gen-contest-routing:
    desc: Generate the application topology from contest host values
    cmds:
      - |
        cat > webapp/go/cluster.json <<'EOF'
        {
          "hosts": [
            {"name": "isucon-1", "ip": "{{index .IP "isucon-1"}}"},
            {"name": "isucon-2", "ip": "{{index .IP "isucon-2"}}"},
            {"name": "isucon-3", "ip": "{{index .IP "isucon-3"}}"},
            {"name": "isucon-4", "ip": "{{index .IP "isucon-4"}}"},
            {"name": "isucon-5", "ip": "{{index .IP "isucon-5"}}"}
          ]
        }
        EOF
      - |
        cat > nginx/conf.d/contest-routing.conf <<'EOF'
        # GENERATED by 'task gen' — do not edit
        upstream app_owner_2 { server {{index .IP "isucon-2"}}:{{.LISTEN_PORT}}; keepalive 60; }
        upstream app_owner_3 { server {{index .IP "isucon-3"}}:{{.LISTEN_PORT}}; keepalive 60; }
        upstream app_owner_4 { server {{index .IP "isucon-4"}}:{{.LISTEN_PORT}}; keepalive 60; }
        upstream app_owner_5 { server {{index .IP "isucon-5"}}:{{.LISTEN_PORT}}; keepalive 60; }

        map $uri $user_backend {
          default app;
          ~^/user/(?:1|[0-9]*[02468]1)(?:/|$) app_owner_2;
          ~^/user/(?:6|[0-9]*[02468]6)(?:/|$) app_owner_3;
          ~^/user/[0-9]*[13579]1(?:/|$) app_owner_4;
          ~^/user/[0-9]*[13579]6(?:/|$) app_owner_5;
          ~^/user/[0-9]*[27](?:/|$) app_owner_2;
          ~^/user/[0-9]*[38](?:/|$) app_owner_3;
          ~^/user/[0-9]*[49](?:/|$) app_owner_4;
          ~^/user/[0-9]*[05](?:/|$) app_owner_5;
        }
        EOF
